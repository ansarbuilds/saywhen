[package]
name = "saywhen"
version = "0.2.0"
description = "Hands-free, hotkey-free local voice input for developers"
authors = ["Mohamed Ansar"]
license = "MIT"
edition = "2021"

[lib]
name = "saywhen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
voice_activity_detector = "0.2.1"
whisper-rs = { version = "0.16.0", features = ["metal"] }
enigo = "0.6.1"
arboard = "3.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
